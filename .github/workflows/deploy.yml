name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changes in repository
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

      - name: Build Backend
        run: |
          cd backend
          go build -o bin/

      - name: Ensure bin directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            mkdir -p /var/www/personal-site/bin

      - name: Push binary to DigitalOcean
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "backend/bin/personal-site"
          target: "/var/www/personal-site/bin"
          strip_components: 2

      - name: Push service file to DigitalOcean
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "backend/goweb.service"
          target: "/tmp"

      - name: Setup environment and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Remove any existing goweb.service (file or directory)
            rm -rf /var/www/personal-site/goweb.service
            
            # Create .env with CMS secrets
            cat > /var/www/personal-site/.env << 'EOF'
            CMS_AUTH0_DOMAIN=${{ secrets.CMS_AUTH0_DOMAIN }}
            CMS_AUTH0_CLIENT_ID=${{ secrets.CMS_AUTH0_CLIENT_ID }}
            CMS_AUTH0_CLIENT_SECRET=${{ secrets.CMS_AUTH0_CLIENT_SECRET }}
            CMS_AUTH0_AUDIENCE=${{ secrets.CMS_AUTH0_AUDIENCE }}
            CMS_API_URL=${{ secrets.CMS_API_URL }}
            EOF
            
            # Copy service file from /tmp
            cp /tmp/goweb.service /var/www/personal-site/goweb.service
            
            # Install systemd service
            sudo cp /var/www/personal-site/goweb.service /etc/systemd/system/goweb.service
            sudo systemctl daemon-reload
            sudo systemctl restart goweb

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Building Front End
        run: |
          cd frontend
          sed -e 's|{{GIPHY_API_KEY}}|$API_KEY|' -e 's|{{PRIV_API_URL}}|https://api.giftmugweni.com|' -e 's|{{BASE_URL}}|https://giftmugweni.com|' -e 's|{{CMS_URL}}|https://api.giftmugweni.com/cms|' .env > .env.production
          npm install
          npm run build
          git clone https://$PAT@github.com/Stelele/personal-site-build.git out
          rm -r out/*
          cp -R dist/* out/
          cd out
          cp index.html 404.html
          git config --global user.email "giftmugweni@gmail.com"
          git config --global user.name "stelele"
          git add .
          git commit -m "Deploy build files"
          git push origin $DEPLOY_BRANCH
        env:
          API_KEY: ${{ secrets.GIPHY_API_KEY }}
          DEPLOY_BRANCH: main
          PAT: ${{ secrets.PAT }}